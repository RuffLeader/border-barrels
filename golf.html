<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bag Gapping & Sim Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8 font-sans">
  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold text-emerald-400">Bag Gapping & Sim Tracker</h1>
        <p class="text-sm text-slate-400">Uneekor Session Matrix (Metres / km/h)</p>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <label class="flex items-center gap-2 px-3 py-1.5 bg-slate-900 rounded text-sm border border-slate-700 cursor-pointer select-none">
          <input type="checkbox" id="outlierToggle" onchange="renderTableAndCharts()" class="accent-emerald-500 w-4 h-4" />
          <span>Filter Mishits (Stock Shots)</span>
        </label>
        <button onclick="exportData()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded text-sm border border-slate-700">Export JSON</button>
        <label class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded text-sm border border-slate-700 cursor-pointer">
          Import JSON
          <input type="file" id="importFile" class="hidden" onchange="importData(event)" />
        </label>
        <button onclick="resetDefault()" class="px-3 py-1.5 bg-rose-950 hover:bg-rose-900 text-rose-200 rounded text-sm border border-rose-800">Reset Session</button>
      </div>
    </header>

    <!-- Add Shot / Session Form -->
    <section class="bg-slate-900 p-4 rounded-xl border border-slate-800">
      <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-3">Log Shot or Session Average</h2>
      <form id="shotForm" class="grid grid-cols-2 md:grid-cols-7 gap-3">
        <select id="clubSelect" class="bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm col-span-2 md:col-span-1">
          <option value="Driver">Driver</option>
          <option value="3 Wood">3 Wood</option>
          <option value="4 Hybrid">4 Hybrid</option>
          <option value="4 Iron">4 Iron</option>
          <option value="6 Iron">6 Iron</option>
          <option value="8 Iron">8 Iron</option>
          <option value="PW">Pitching Wedge</option>
          <option value="60° Wedge">60° Wedge</option>
        </select>
        <input type="number" step="0.1" id="carryInput" placeholder="Carry (m)" required class="bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm" />
        <input type="number" step="0.1" id="totalInput" placeholder="Total (m)" required class="bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm" />
        <input type="number" step="0.1" id="sideInput" placeholder="Side (-L / +R m)" value="0" class="bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm" />
        <input type="number" step="0.01" id="smashInput" placeholder="Smash (opt)" class="bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm" />
        <input type="number" step="1" id="spinInput" placeholder="Back Spin (opt)" class="bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm" />
        <button type="submit" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold rounded px-4 py-2 text-sm col-span-2 md:col-span-1">Add Entry</button>
      </form>
    </section>

    <!-- Visual Charts -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
        <h3 class="text-sm font-semibold text-slate-300 mb-2">Carry vs. Total Gapping (Metres)</h3>
        <canvas id="gappingChart" height="230"></canvas>
      </div>
      <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
        <h3 class="text-sm font-semibold text-slate-300 mb-2">Dispersion Map (Carry vs. Offline m)</h3>
        <canvas id="dispersionChart" height="230"></canvas>
      </div>
    </div>

    <!-- Summary Table -->
    <section class="bg-slate-900 rounded-xl border border-slate-800 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-800/70 text-slate-400 uppercase text-xs">
            <tr>
              <th class="px-4 py-3">Club</th>
              <th class="px-4 py-3">Shots</th>
              <th class="px-4 py-3">Avg Carry</th>
              <th class="px-4 py-3">Avg Total</th>
              <th class="px-4 py-3">Gap (Carry)</th>
              <th class="px-4 py-3">Avg Offline</th>
              <th class="px-4 py-3">Avg Smash</th>
              <th class="px-4 py-3">Avg Spin</th>
              <th class="px-4 py-3 text-right">Action</th>
            </tr>
          </thead>
          <tbody id="bagTableBody" class="divide-y divide-slate-800"></tbody>
        </table>
      </div>
    </section>
  </div>
