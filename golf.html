<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bag Gapping & Sim Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8 font-sans">
  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold text-emerald-400">Bag Gapping & Sim Tracker</h1>
        <p class="text-sm text-slate-400">Uneekor Session Matrix (Metres / km/h)</p>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <label class="flex items-center gap-2 px-3 py-1.5 bg-slate-900 rounded text-sm border border-slate-700 cursor-pointer select-none">
          <input type="checkbox" id="outlierToggle" onchange="renderTableAndCharts()" class="accent-emerald-500 w-4 h-4" />
          <span>Filter Mishits (Stock Shots)</span>
        </label>
        <button type="button" onclick="exportData()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded text-sm border border-slate-700">Export JSON</button>
        <label class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded text-sm border border-slate-700 cursor-pointer">
          Import JSON
          <input type="file" id="importFile" class="hidden" onchange="importData(event)" />
        </label>
        <button type="button" onclick="resetDefault()" class="px-3 py-1.5 bg-rose-950 hover:bg-rose-900 text-rose-200 rounded text-sm border border-rose-800">Reset Session</button>
      </div>
    </header>

    <!-- Add Shot / Session Form -->
    <section class="bg-slate-900 p-4 rounded-xl border border-slate-800">
      <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-3">Log Shot or Session Average</h2>
      <form id="shotForm" class="grid grid-cols-2 md:grid-cols-7 gap-3">
